<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Game</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e293b);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:90%;
    max-width:500px;
    background:#1e293b;
    padding:25px;
    border-radius:15px;
    box-shadow:0 0 20px rgba(0,0,0,.5);
}

h1{
    color:#38bdf8;
    text-align:center;
    margin-bottom:20px;
}

#progress{
    color:#facc15;
    text-align:right;
    margin-bottom:10px;
}

#question{
    color:white;
    font-size:22px;
    margin-bottom:20px;
}

.option{
    display:block;
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:8px;
    background:#334155;
    color:white;
    cursor:pointer;
    transition:.3s;
    font-size:16px;
}

.option:hover:not(:disabled){
    background:#3b82f6;
}

.option:disabled{
    cursor:not-allowed;
}

#nextBtn,#restartBtn{
    width:100%;
    padding:12px;
    margin-top:15px;
    border:none;
    border-radius:8px;
    background:#22c55e;
    color:white;
    font-size:17px;
    cursor:pointer;
}

#nextBtn:disabled{
    background:#64748b;
    cursor:not-allowed;
}

#score{
    color:#facc15;
    text-align:center;
    font-size:22px;
    margin-top:20px;
}
</style>

</head>

<body>

<div class="container">

<h1>Quiz Game</h1>

<div id="quiz">

<div id="progress"></div>

<h2 id="question"></h2>

<div id="options"></div>

<button id="nextBtn" disabled>Next</button>

</div>

<div id="score"></div>

<button id="restartBtn" style="display:none;">Restart Quiz</button>

</div>

<script>

const quiz=[

{
question:"What does HTML stand for?",
options:[
"Hyper Text Markup Language",
"High Text Machine Language",
"Hyper Tool Markup Language",
"Home Tool Markup Language"
],
answer:0
},

{
question:"Which language is used for styling web pages?",
options:[
"Python",
"HTML",
"CSS",
"Java"
],
answer:2
},

{
question:"Which language adds interactivity to websites?",
options:[
"JavaScript",
"C++",
"SQL",
"PHP"
],
answer:0
},

{
question:"Which tag creates a hyperlink?",
options:[
"&lt;img&gt;",
"&lt;a&gt;",
"&lt;p&gt;",
"&lt;div&gt;"
],
answer:1
},

{
question:"Inside which HTML element do we put JavaScript?",
options:[
"&lt;style&gt;",
"&lt;script&gt;",
"&lt;css&gt;",
"&lt;js&gt;"
],
answer:1
}

];

let current=0;
let score=0;

const question=document.getElementById("question");
const options=document.getElementById("options");
const nextBtn=document.getElementById("nextBtn");
const progress=document.getElementById("progress");
const scoreText=document.getElementById("score");
const restartBtn=document.getElementById("restartBtn");

function loadQuestion(){

nextBtn.disabled=true;

progress.innerHTML="Question "+(current+1)+" / "+quiz.length;

question.innerHTML=quiz[current].question;

options.innerHTML="";

quiz[current].options.forEach((opt,index)=>{

let btn=document.createElement("button");

btn.innerHTML=opt;

btn.className="option";

btn.onclick=function(){

document.querySelectorAll(".option").forEach(b=>b.disabled=true);

if(index===quiz[current].answer){

btn.style.background="#22c55e";
score++;

}else{

btn.style.background="#ef4444";
document.querySelectorAll(".option")[quiz[current].answer].style.background="#22c55e";

}

nextBtn.disabled=false;

}

options.appendChild(btn);

});

}

nextBtn.onclick=function(){

current++;

if(current<quiz.length){

loadQuestion();

}else{

document.getElementById("quiz").style.display="none";

scoreText.innerHTML="🎉 Your Score: <b>"+score+"</b> / <b>"+quiz.length+"</b>";

restartBtn.style.display="block";

}

}

restartBtn.onclick=function(){

current=0;
score=0;

scoreText.innerHTML="";

restartBtn.style.display="none";

document.getElementById("quiz").style.display="block";

loadQuestion();

}

loadQuestion();

</script>

</body>
</html>
