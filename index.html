<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Game</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e293b);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:90%;
    max-width:550px;
    background:#1e293b;
    border-radius:15px;
    padding:20px;
    box-shadow:0 0 20px rgba(0,0,0,.4);
}

.banner{
    width:100%;
    height:180px;
    object-fit:cover;
    border-radius:12px;
    margin-bottom:15px;
}

h1{
    color:#38bdf8;
    text-align:center;
    margin-bottom:15px;
}

#progress{
    color:#facc15;
    text-align:right;
    margin-bottom:10px;
}

#question{
    color:white;
    margin-bottom:15px;
}

.option{
    width:100%;
    padding:12px;
    margin:8px 0;
    border:none;
    border-radius:8px;
    background:#334155;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

.option:hover{
    background:#2563eb;
}

.option:disabled{
    cursor:not-allowed;
}

#nextBtn,#restartBtn{
    width:100%;
    padding:12px;
    margin-top:15px;
    border:none;
    border-radius:8px;
    background:#22c55e;
    color:white;
    font-size:17px;
    cursor:pointer;
}

#nextBtn:disabled{
    background:#64748b;
    cursor:not-allowed;
}

#score{
    text-align:center;
    color:#facc15;
    font-size:24px;
    margin-top:20px;
}
</style>

</head>
<body>

<div class="container">

<img class="banner"
src="https://images.unsplash.com/photo-1503676260728-1c00da094a0b?w=800"
alt="Quiz Banner">

<h1>Quiz Game</h1>

<div id="quiz">

<div id="progress"></div>

<h2 id="question"></h2>

<div id="options"></div>

<button id="nextBtn" disabled>Next</button>

</div>

<div id="score"></div>

<button id="restartBtn" style="display:none;">Restart Quiz</button>

</div>

<script>

const quiz=[
{
question:"What does HTML stand for?",
options:[
"Hyper Text Markup Language",
"High Text Machine Language",
"Hyper Tool Markup Language",
"Home Tool Markup Language"
],
answer:0
},
{
question:"Which language is used for styling web pages?",
options:[
"Python",
"HTML",
"CSS",
"Java"
],
answer:2
},
{
question:"Which language adds interactivity to websites?",
options:[
"JavaScript",
"C++",
"SQL",
"PHP"
],
answer:0
},
{
question:"Which tag creates a hyperlink?",
options:[
"<img>",
"<a>",
"<p>",
"<div>"
],
answer:1
},
{
question:"Inside which HTML element do we put JavaScript?",
options:[
"<style>",
"<script>",
"<css>",
"<js>"
],
answer:1
}
];

let current=0;
let score=0;

const question=document.getElementById("question");
const options=document.getElementById("options");
const nextBtn=document.getElementById("nextBtn");
const progress=document.getElementById("progress");
const scoreText=document.getElementById("score");
const restartBtn=document.getElementById("restartBtn");

function loadQuestion(){

nextBtn.disabled=true;

progress.textContent=`Question ${current+1} of ${quiz.length}`;

question.textContent=quiz[current].question;

options.innerHTML="";

quiz[current].options.forEach((opt,index)=>{

let btn=document.createElement("button");

btn.textContent=opt;

btn.className="option";

btn.onclick=function(){

document.querySelectorAll(".option").forEach(b=>b.disabled=true);

if(index===quiz[current].answer){

btn.style.background="#22c55e";
score++;

}else{

btn.style.background="#ef4444";
document.querySelectorAll(".option")[quiz[current].answer].style.background="#22c55e";

}

nextBtn.disabled=false;

};

options.appendChild(btn);

});

}

nextBtn.onclick=function(){

current++;

if(current<quiz.length){

loadQuestion();

}else{

document.getElementById("quiz").style.display="none";

scoreText.innerHTML=`🎉 You scored <b>${score}</b> out of <b>${quiz.length}</b>`;

restartBtn.style.display="block";

}

};

restartBtn.onclick=function(){

current=0;
score=0;

scoreText.innerHTML="";

restartBtn.style.display="none";

document.getElementById("quiz").style.display="block";

loadQuestion();

};

loadQuestion();

</script>

</body>
</html>
